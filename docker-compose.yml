services:
  slotsync:
    build: .
    container_name: slotsync
    restart: unless-stopped
    ports:
      - "8080:8080/tcp"
      - "9977:9977/udp"
    volumes:
      - ./data:/data
    environment:
      SLOTSYNC_DATA: /data
      SLOTSYNC_HTTP_PORT: 8080
      SLOTSYNC_UDP_PORT: 9977
      SLOTSYNC_TOKEN: ${SLOTSYNC_TOKEN:?set SLOTSYNC_TOKEN in .env}
      SLOTSYNC_PSK: ${SLOTSYNC_PSK:?set SLOTSYNC_PSK in .env}
      SLOTSYNC_MAX_CARD_BYTES: 16777216
      SLOTSYNC_LOG_LEVEL: INFO
