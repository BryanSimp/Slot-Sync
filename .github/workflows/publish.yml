name: Publish container image

# Builds server/Dockerfile and pushes it to GitHub Container Registry, so the
# Portainer host pulls a finished image instead of needing a build toolchain.
#
# Image: ghcr.io/bryansimp/slot-sync
# GHCR requires a lowercase name; docker/metadata-action lowercases it for us,
# which matters because this repo is "BryanSimp/Slot-Sync".

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Publishing an image that fails its own tests would be worse than not
  # publishing at all, so this gates the build.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt -r server/requirements-dev.txt

      - name: Server tests
        working-directory: server
        run: python -m pytest -q

      - name: Lint
        run: |
          python -m ruff check server dolphin
          python -m ruff format --check server dolphin

      - name: Dolphin daemon tests
        working-directory: dolphin
        run: python -m pytest -q

      # The Wii client's protocol core is portable C with no libogc dependency,
      # so the host compiler can check it here. Vectors and wire format only --
      # the live half needs a running server.
      - name: Wii protocol core tests
        working-directory: wii/tests
        run: make CC=gcc && ./test_core

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # QEMU so the arm64 image can be built on an amd64 runner. PLAN.md
      # section 11 expects this to run on "a LAN box or a Pi", and a Pi is
      # arm64. Drop that platform below if you only ever deploy to x86 and
      # want the build to finish faster.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The Dockerfile copies requirements.txt and src/ relative to here.
          context: ./server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
