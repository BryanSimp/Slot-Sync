# Deploy from the published image instead of building.
#
# This is the file to paste into Portainer's stack web editor. It needs no
# access to the source at all -- only to the registry -- so the Portainer host
# never needs a build toolchain or a checkout of this repo.
#
# The image is built and pushed by .github/workflows/publish.yml.

services:
  slotsync:
    image: ghcr.io/bryansimp/slot-sync:latest
    container_name: slotsync
    restart: unless-stopped
    ports:
      # Host ports are overridable, because 8080 in particular is heavily
      # contested on a home server -- Portainer, qBittorrent, Jenkins and a
      # dozen other things default to it. Only the host side moves; the
      # container still listens on 8080/9977 internally.
      - "${SLOTSYNC_HTTP_BIND:-8080}:8080/tcp"
      # UDP, and it is the console's only way in. If you move this, the port in
      # the Wii's sd:/slotsync/slotsync.cfg has to match.
      - "${SLOTSYNC_UDP_BIND:-9977}:9977/udp"
    volumes:
      # Named, so redeploying the stack cannot take the save history with it.
      - slotsync-data:/data
    environment:
      SLOTSYNC_DATA: /data
      SLOTSYNC_HTTP_PORT: 8080
      SLOTSYNC_UDP_PORT: 9977
      # Both are required and the container refuses to start without them.
      # Set them as stack environment variables in Portainer.
      SLOTSYNC_TOKEN: ${SLOTSYNC_TOKEN:?set SLOTSYNC_TOKEN as a stack variable}
      SLOTSYNC_PSK: ${SLOTSYNC_PSK:?set SLOTSYNC_PSK as a stack variable}
      SLOTSYNC_MAX_CARD_BYTES: 16777216
      SLOTSYNC_LOG_LEVEL: INFO

volumes:
  slotsync-data:
