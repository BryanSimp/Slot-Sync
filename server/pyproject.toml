# Tool configuration only. Runtime dependencies live in requirements.txt and
# dev-only ones in requirements-dev.txt, per PLAN.md section 12.

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # starlette's TestClient imports a deprecated anyio alias at module scope.
    # Not our code and not actionable here; everything else stays an error.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 90
src = ["src", "tests", "scripts"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection idiom is a call in the argument default. B008
# exists to catch mutable defaults; these are not that.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]
